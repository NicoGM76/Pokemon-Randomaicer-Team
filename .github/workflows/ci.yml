name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync all regional Pokédex data
        run: npm run data:sync-all

      - name: Validate catalog and generated data
        run: npm run data:validate-all

      - name: Sync verified competitive metagame snapshots
        run: npm run data:sync-meta

      - name: Validate backup script syntax
        run: bash -n scripts/db/backup-to-drive.sh scripts/db/restore-check.sh

      - name: Test competitive source converter
        run: npm run meta:test

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
