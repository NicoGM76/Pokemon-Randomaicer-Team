name: Deploy Pokemon Team Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Monday 12:00 UTC; rebuilds dated metagame snapshots without touching code.
    - cron: '0 12 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync all regional Pokédex data
        run: npm run data:sync-all

      - name: Validate catalog and generated data
        run: npm run data:validate-all

      - name: Sync verified competitive metagame snapshots
        run: npm run data:sync-meta

      - name: Test competitive source converter
        run: npm run meta:test

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
